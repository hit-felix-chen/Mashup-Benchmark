[project]
name = "mashup-benchmark"
version = "0.1.0"
description = "Benchmark metadata, adapters, and evaluators for long-video music-synchronized mashup generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.24.6",
    "jsonschema>=4.23.0",
    "opencv-python-headless>=4.10.0.84",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "scenedetect==0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
