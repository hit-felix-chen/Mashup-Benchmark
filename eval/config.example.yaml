# Copy this file to eval/config.yaml and fill in your VLM credentials.
# eval/config.yaml is intentionally ignored by git.
vlm:
  provider: dashscope
  model: qwen3.7-plus
  api_key: YOUR_API_KEY_HERE
  base_url: https://dashscope.aliyuncs.com/api/v1
  timeout_sec: 120
  temperature: 0
  max_video_mb: 500
  video_fps: 2
  max_video_frames: 128
  max_retries: 3
  retry_backoff_sec: 2

metrics:
  # Seven-metric benchmark weights. If a metric such as human OQ is missing,
  # the evaluator renormalizes over the metrics that are actually available.
  weights:
    IF: 0.1000
    BCS: 0.2000
    AEC: 0.2000
    VQ: 0.1000
    TC: 0.1000
    NC: 0.1000
    OQ: 0.2000

automatic_metrics:
  # AEC motion-energy sampling.
  video_sample_fps: 2.0
  audio_window_sec: 0.5
  # BCS first proposes cuts with full-frame adaptive detection, then sends the
  # adjacent frame pair at every candidate to the VLM for binary validation.
  adaptive_threshold: 2.0
  adaptive_min_content_val: 15.0
  adaptive_min_scene_len: 5  # frames
  bcs_cut_vlm_max_concurrency: 10
  bcs_cut_vlm_frame_width: 640
  bcs_cut_vlm_enable_thinking: false
  beat_window_sec: 0.05
  # Exponential BCS tau. exp(-0.10 / 0.196) ~= 0.60, so a 100ms offset is a passing cut.
  bcs_tau_sec: 0.196
